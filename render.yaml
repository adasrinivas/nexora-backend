services:
  - type: web
    name: nexora-backend
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:file:/app/data/nexoradb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
      - key: SPRING_DATASOURCE_USERNAME
        value: sa
      - key: SPRING_DATASOURCE_PASSWORD
        value: ""
